<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuisine — La Paillote de Maël</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/badge.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/caisse.css">
<script src="js/badge.js" defer></script>
<script type="module" src="js/cuisine.js"></script>
</head>
<body>

<header class="entete">
  <div class="contenu entete__barre">
    <a class="marque" href="cuisine.html">
      <span class="cadre-badge marque__badge"><svg class="badge" viewBox="0 0 200 200" aria-hidden="true"><use href="#badge" width="200" height="200"/></svg></span>
      <span class="marque__nom">La Paillote<br><span class="italique">— cuisine</span></span>
    </a>
  </div>
</header>

<main class="contenu">

  <!-- Connexion : visible tant que l'équipe n'est pas identifiée. -->
  <section class="connexion" id="connexion" hidden>
    <h1 class="connexion__titre">L’écran de service</h1>
    <form class="formulaire" id="formulaire-connexion">
      <div class="champ">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="champ">
        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe"
               autocomplete="current-password" required>
      </div>
      <p class="message message--erreur" id="connexion-erreur" hidden></p>
      <button type="submit" class="bouton">Ouvrir la cuisine</button>
    </form>
  </section>

  <!-- Le service. -->
  <section id="service" hidden>
    <div class="service__barre">
      <h1 class="titre-section" style="font-size: 1.6rem;">En cours</h1>
      <button type="button" class="service__bouton" id="bouton-son"
              aria-pressed="false">🔕 Sonnerie coupée</button>
      <button type="button" class="service__bouton" id="bouton-sortir">Fermer l’écran</button>
      <p class="service__etat" id="service-etat">—</p>
    </div>

    <p class="message" id="service-vide" hidden>
      Rien à préparer pour l'instant. Les nouvelles commandes apparaissent
      toutes seules — et sonnent si la sonnerie est ouverte.
    </p>

    <div class="tickets" id="tickets-actifs"></div>

    <details class="historique">
      <summary>Servies &amp; annulées aujourd'hui (<span id="historique-compte">0</span>)</summary>
      <div class="tickets" id="tickets-finis"></div>
    </details>
  </section>

</main>

</body>
</html>
